name: transcribe

# Repo-as-brain mode: commit an audio file into brain/inbox/ and this workflow
# transcribes it, ingests it into brain/notes/, and commits the note back.
# Your git history becomes your second brain's changelog.
#
# Setup (one time):
#   1. Remove "brain/" from .gitignore (keep brain/.index/ and brain/archive/ ignored).
#   2. Either add an OPENAI_API_KEY repo secret (fast, uses the Whisper API),
#      or leave it unset to run local faster-whisper on the runner
#      (set the V2B_MODEL repo variable to "small" — large-v3 is too slow for CI).

on:
  push:
    paths:
      - "brain/inbox/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install STT engine
        run: pip install faster-whisper openai

      - name: Transcribe and ingest the inbox
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          V2B_MODEL: ${{ vars.V2B_MODEL || 'small' }}
          V2B_LANGUAGE: ${{ vars.V2B_LANGUAGE }}
        run: python watch.py --once

      - name: Commit the new notes
        run: |
          git config user.name "voice2brain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brain
          git diff --cached --quiet || git commit -m "transcribe: notes from inbox audio"
          git push
